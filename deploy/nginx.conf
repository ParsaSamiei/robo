# Docs/27_DEPLOYMENT.md §14-16: Nginx handles HTTPS termination, HTTP->HTTPS
# redirect, domain routing, and proxying to the Next.js process.
#
# Copy to /etc/nginx/sites-available/iust-robotics.conf on the VPS, then:
#   sudo ln -s /etc/nginx/sites-available/iust-robotics.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Get a certificate first (see README's VPS steps) -- certbot will rewrite
# the server blocks below to add the actual `listen 443 ssl` + cert paths.

server {
    listen 80;
    server_name example.com www.example.com;  # replace with the real domain

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Docs/27 §16: "Static asset handling when useful" -- let Nginx serve
    # uploaded media directly instead of round-tripping through Node.
    # Path assumes the app is deployed at /opt/robotics-club (Docs/27 §38's
    # own example path) with docker-compose's ./data/uploads bind mount --
    # adjust both to match wherever you actually clone the repo.
    location /uploads/ {
        alias /opt/robotics-club/data/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
}
